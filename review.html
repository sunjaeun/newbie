<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubwayHub - 역별 리뷰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>SubwayHub <span>역별 리뷰</span></h1>
    </header>

    <nav class="nav-tabs">
        <a href="index.html" class="tab-btn">약속 잡기</a>
        <a href="review.html" class="tab-btn active">리뷰</a>
        <a href="achievement.html" class="tab-btn">업적</a>
        <a href="wiki.html" class="tab-btn">역무위키</a>
    </nav>

    <main class="container">
        <section class="page-content">
            <h2>🔍 역별 상세 리뷰</h2>
            <div class="search-box">
                <input type="text" placeholder="역 이름을 입력하세요 (예: 강남역)">
                <button type="button">검색</button>
            </div>
            
            <div class="card-grid">
                <div class="card">
                    <h3>🚽 시설 (화장실 정보)</h3>
                    <p class="rating">⭐ 4.5 / 5.0</p>
                    <p>개찰구 밖 위치, 청결 상태 양호, 휴지 항시 비치됨.</p>
                </div>
                <div class="card">
                    <h3>🔄 환승 난이도 (환승역 전용)</h3>
                    <span class="badge hard">상 (매우 복잡)</span>
                    <p>2호선 ↔ 신분당선 환승 시 계단 및 이동 동선이 김.</p>
                </div>
                <div class="card">
                    <h3>🍽️ 주변 상권 정보</h3>
                    <p>11번 출구 방향 혼밥하기 좋은 식당 및 프랜차이즈 카페 다수 위치.</p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
