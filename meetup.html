    <link rel="icon" type="image/png" href="assets/logo-mark.png">
    <link rel="stylesheet" href="style.css">

<body>

    <!-- ==========================================

    ========================================== -->

    <header class="header">

            <a href="index.html" class="brand">

                <span class="brand-logo-wrap">
                    <img

                        aria-hidden="true"

    <!-- ==========================================

    ========================================== -->

            <input

            >


            <div class="modal-buttons">

    <!-- ==========================================
         네비게이션
    ========================================== -->

    <nav class="nav-tabs">

        >

        <a

    <!-- ==========================================
         메인
    ========================================== -->

    <main class="container">

        <section class="page-content">

            <div class="page-intro">

                <p class="page-kicker">
                    MEETUP
                </p>

                <h2>
                    중간 지점 약속 장소 찾기
                </h2>

                <p>
                    두 출발역이 접근하기 좋은 환승역 후보를 찾고,
                    실제로 등록된 리뷰가 있다면 함께 보여드려요.
                </p>

            </div>


            <!-- ==================================
                 역 입력
            =================================== -->

            <div class="input-section">

                <div class="input-group station-input-group">

                    <label for="myStation">
                        나의 출발역
                    </label>

                    <input
                        type="text"
                        id="myStation"
                        placeholder="예: 강남"
                        autocomplete="off"
                    >

                    <div
                        class="suggestions-box"
                        id="myStationSuggestions"
                    ></div>

                </div>


                <div class="input-group station-input-group">

                    <label for="friendStation">
                        친구의 출발역
                    </label>

                    <input
                        type="text"
                        id="friendStation"
                        placeholder="예: 혜화"
                        autocomplete="off"
                    >

                        class="suggestions-box"
                        id="friendStationSuggestions"
                    ></div>

                </div>

                    id="findMeetingButton"
                    class="submit-btn"
                    type="button"

                    후보 역 찾기

            <div

                role="note"
            >

                    임의의 시간·리뷰·별점은 생성하지 않아요.
                </p>
            </div>


            <div
                class="loading"
                id="loadingIndicator"
            >

            </div>

            ></div>

    <!--
        stationDB는 다른 페이지와 동일하게
        stationData.js 한 곳에서만 관리합니다.
    -->
    <script src="stationData.js"></script>


    <script>

        /* ==========================================
           로그인
        ========================================== */

        function checkLoginStatus() {

            const savedNickname =
                localStorage.getItem(
                    "subwayhub_user"
                );


            const authSection =
                document.getElementById(
                    "authSection"
                );


            if (savedNickname) {

                authSection.innerHTML = `
                    <span class="user-greeting">
                        ${escapeHTML(savedNickname)}님
                    </span>

                    <button
                        class="auth-btn"
                        type="button"
                        onclick="handleLogout()"
                    >
                        로그아웃
                    </button>
                `;

            }

            else {

                authSection.innerHTML = `
                    <button
                        class="auth-btn"
                        type="button"
                        onclick="openLoginModal()"
                    >
                        로그인
                    </button>
                `;

            }

        }


        function openLoginModal() {

            document.getElementById(
                "loginModal"
            ).style.display =
                "flex";


            document.getElementById(
                "nicknameInput"
            ).focus();

        }


        function closeLoginModal() {

            document.getElementById(
                "loginModal"
            ).style.display =
                "none";


            document.getElementById(
                "nicknameInput"
            ).value =
                "";


            document.getElementById(
                "passwordInput"
            ).value =
                "";

        }


        function handleLogin() {

            const nickname =
                document.getElementById(
                    "nicknameInput"
                ).value.trim();


            const password =
                document.getElementById(
                    "passwordInput"
                ).value.trim();


            if (!nickname) {

                alert(
                    "아이디를 입력해주세요!"
                );

                document.getElementById(
                    "nicknameInput"
                ).focus();

                return;

            }


            if (!password) {

                alert(
                    "비밀번호를 입력해주세요!"
                );

                document.getElementById(
                    "passwordInput"
                ).focus();

                return;

            }


            /*
                현재 해커톤 프로토타입은
                실제 계정 서버가 없으므로
                닉네임을 로그인 식별자로 사용합니다.
            */

            localStorage.setItem(
                "subwayhub_user",
                nickname
            );


            closeLoginModal();

            checkLoginStatus();

        }


        function handleLogout() {

            localStorage.removeItem(
                "subwayhub_user"
            );


            checkLoginStatus();

        }


        /* ==========================================
           기본 유틸
        ========================================== */

        function normalizeStationName(
            stationName
        ) {

            return String(
                stationName || ""
            )
                .trim()
                .replace(/역$/, "");

        }


        function escapeHTML(value) {

            return String(
                value ?? ""
            )
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        function getStationColor(
            lines
        ) {

            const lineColors = {

                "1호선": "#0052A4",
                "2호선": "#00A84D",
                "3호선": "#EF7C1C",
                "4호선": "#00A5DE",
                "5호선": "#996CAC",
                "6호선": "#CD7C2F",
                "7호선": "#747F00",
                "8호선": "#E6186C",
                "9호선": "#BDB092",

                "신분당선": "#D4003B",
                "수인분당선": "#F5A200",
                "경의중앙선": "#77C4A3",
                "공항철도": "#0090D2",
                "경춘선": "#178C72"

            };


            for (
                const line of lines
            ) {

                if (lineColors[line]) {

                    return lineColors[line];

                }

            }


            return "#101010";

        }


        /* ==========================================
           리뷰 데이터
        ========================================== */

        function loadStationReviews() {

            try {

                const saved =
                    JSON.parse(
                        localStorage.getItem(
                            "stationReviews"
                        )
                    );


                return Array.isArray(saved)
                    ? saved
                    : [];

            }

            catch (error) {

                console.error(
                    "리뷰 데이터를 읽지 못했습니다.",
                    error
                );


                return [];

            }

        }


        function getStationReviewData(
            stationName
        ) {

            const normalizedStation =
                normalizeStationName(
                    stationName
                );


            const allReviews =
                loadStationReviews();


            const stationReviews =
                allReviews
                    .filter(
                        function(review) {

                            return (
                                normalizeStationName(
                                    review.station
                                )
                                ===
                                normalizedStation
                            );

                        }
                    )
                    .sort(
                        function(a, b) {

                            return (
                                Number(
                                    b.createdAt || 0
                                )
                                -
                                Number(
                                    a.createdAt || 0
                                )
                            );

                        }
                    );


            /*
                화장실 만족도:
                reviewWrite에서 실제로 입력받는 1~5점 값만 사용
            */

            const toiletRatings =
                stationReviews
                    .map(
                        function(review) {

                            return Number(
                                review.toiletRating
                            );

                        }
                    )
                    .filter(
                        function(value) {

                            return (
                                Number.isFinite(value)
                                &&
                                value >= 1
                                &&
                                value <= 5
                            );

                        }
                    );


            let toiletAverage = null;


            if (
                toiletRatings.length > 0
            ) {

                const total =
                    toiletRatings.reduce(
                        function(sum, value) {

                            return sum + value;

                        },
                        0
                    );


                toiletAverage =
                    (
                        total
                        /
                        toiletRatings.length
                    )
                    .toFixed(1);

            }


            /*
                환승 난이도:
                0은 "환승역이 아니에요"이므로
                평균 계산에서 제외
            */

            const transferRatings =
                stationReviews
                    .map(
                        function(review) {

                            return Number(
                                review.transferDifficulty
                            );

                        }
                    )
                    .filter(
                        function(value) {

                            return (
                                Number.isFinite(value)
                                &&
                                value >= 1
                                &&
                                value <= 3
                            );

                        }
                    );


            let transferAverage = null;


            if (
                transferRatings.length > 0
            ) {

                const total =
                    transferRatings.reduce(
                        function(sum, value) {

                            return sum + value;

                        },
                        0
                    );


                transferAverage =
                    (
                        total
                        /
                        transferRatings.length
                    )
                    .toFixed(1);

            }


            /*
                최신 실제 리뷰 문구 하나를 표시합니다.
                임의 문장은 절대 생성하지 않습니다.
            */

            let latestComment = null;


            for (
                const review of stationReviews
            ) {

                const candidates = [

                    review.transferComment,
                    review.commercialComment,
                    review.toiletComment

                ];


                const found =
                    candidates.find(
                        function(comment) {

                            return (
                                typeof comment === "string"
                                &&
                                comment.trim() !== ""
                            );

                        }
                    );


                if (found) {

                    latestComment =
                        found.trim();

                    break;

                }

            }


            return {

                count:
                    stationReviews.length,

                toiletAverage:
                    toiletAverage,

                toiletRatingCount:
                    toiletRatings.length,

                transferAverage:
                    transferAverage,

                transferRatingCount:
                    transferRatings.length,

                latestComment:
                    latestComment

            };

        }


        /* ==========================================
           자동완성
        ========================================== */

        function setupAutocomplete(
            inputId,
            suggestionBoxId
        ) {

            const inputElement =
                document.getElementById(
                    inputId
                );


            const suggestionBox =
                document.getElementById(
                    suggestionBoxId
                );


            inputElement.addEventListener(
                "input",
                function() {

                    const query =
                        normalizeStationName(
                            this.value
                        );


                    suggestionBox.innerHTML =
                        "";


                    if (!query) {

                        suggestionBox.style.display =
                            "none";

                        return;

                    }


                    const matchedStations =
                        Object.keys(
                            stationDB
                        )
                            .filter(
                                function(name) {

                                    return name.includes(
                                        query
                                    );

                                }
                            )
                            .slice(
                                0,
                                12
                            );


                    if (
                        matchedStations.length
                        ===
                        0
                    ) {

                        suggestionBox.style.display =
                            "none";

                        return;

                    }


                    matchedStations.forEach(
                        function(station) {

                            const item =
                                document.createElement(
                                    "button"
                                );


                            item.type =
                                "button";


                            item.className =
                                "suggestion-item";


                            const name =
                                document.createElement(
                                    "strong"
                                );


                            name.textContent =
                                station + "역";


                            const lines =
                                document.createElement(
                                    "span"
                                );


                            lines.textContent =
                                stationDB[
                                    station
                                ].join(", ");


                            item.appendChild(
                                name
                            );


                            item.appendChild(
                                lines
                            );


                            item.addEventListener(
                                "click",
                                function() {

                                    inputElement.value =
                                        station;


                                    suggestionBox.style.display =
                                        "none";

                                }
                            );


                            suggestionBox.appendChild(
                                item
                            );

                        }
                    );


                    suggestionBox.style.display =
                        "block";

                }
            );


            inputElement.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key
                        ===
                        "Enter"
                    ) {

                        event.preventDefault();

                        document.getElementById(
                            "findMeetingButton"
                        ).click();

                    }

                }
            );


            document.addEventListener(
                "click",
                function(event) {

                    if (
                        !inputElement.contains(
                            event.target
                        )
                        &&
                        !suggestionBox.contains(
                            event.target
                        )
                    ) {

                        suggestionBox.style.display =
                            "none";

                    }

                }
            );

        }


        /* ==========================================
           후보 역 찾기
        ========================================== */

        function getMeetingCandidates(
            myStation,
            friendStation
        ) {

            const myLines =
                stationDB[
                    myStation
                ];


            const friendLines =
                stationDB[
                    friendStation
                ];


            const candidates =
                [];


            for (
                const [
                    stationName,
                    lines
                ]
                of
                Object.entries(
                    stationDB
                )
            ) {

                if (
                    stationName
                    ===
                    myStation
                    ||
                    stationName
                    ===
                    friendStation
                ) {

                    continue;

                }


                const reachableFromMe =
                    lines.some(
                        function(line) {

                            return myLines.includes(
                                line
                            );

                        }
                    );


                const reachableFromFriend =
                    lines.some(
                        function(line) {

                            return friendLines.includes(
                                line
                            );

                        }
                    );


                if (
                    reachableFromMe
                    &&
                    reachableFromFriend
                ) {

                    candidates.push(
                        {
                            name:
                                stationName,

                            lines:
                                lines,

                            review:
                                getStationReviewData(
                                    stationName
                                )
                        }
                    );

                }

            }


            /*
                실제 리뷰가 많은 후보를 먼저 보여주되,
                리뷰가 없어도 후보에서 제외하지 않습니다.

                주의:
                이 정렬은 '실제 이동시간 순위'가 아닙니다.
            */

            candidates.sort(
                function(a, b) {

                    if (
                        b.review.count
                        !==
                        a.review.count
                    ) {

                        return (
                            b.review.count
                            -
                            a.review.count
                        );

                    }


                    return a.name.localeCompare(
                        b.name,
                        "ko"
                    );

                }
            );


            return candidates;

        }


        /* ==========================================
           환승 난이도 표시
        ========================================== */

        function getTransferDifficultyLabel(
            average
        ) {

            if (average === null) {

                return null;

            }


            const value =
                Number(average);


            if (value >= 2.5) {

                return "어려움";

            }


            if (value >= 1.5) {

                return "보통";

            }


            return "쉬움";

        }


        /* ==========================================
           후보 카드 생성
        ========================================== */

        function createResultCard(
            station
        ) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "result-card meetup-result-card";


            card.style.setProperty(
                "--station-color",
                getStationColor(
                    station.lines
                )
            );


            const top =
                document.createElement(
                    "div"
                );


            top.className =
                "meetup-card-top";


            const titleArea =
                document.createElement(
                    "div"
                );


            const title =
                document.createElement(
                    "h3"
                );


            title.textContent =
                station.name
                +
                "역";


            const lines =
                document.createElement(
                    "div"
                );


            lines.className =
                "lines";


            lines.textContent =
                station.lines.join(
                    " · "
                );


            titleArea.appendChild(
                title
            );


            titleArea.appendChild(
                lines
            );


            const reviewLink =
                document.createElement(
                    "a"
                );


            reviewLink.className =
                "meetup-review-link";


            reviewLink.href =
                "review.html?station="
                +
                encodeURIComponent(
                    station.name
                );


            reviewLink.textContent =
                "리뷰 보기";


            top.appendChild(
                titleArea
            );


            top.appendChild(
                reviewLink
            );


            card.appendChild(
                top
            );


            const review =
                station.review;


            if (
                review.count === 0
            ) {

                const empty =
                    document.createElement(
                        "div"
                    );


                empty.className =
                    "meetup-review-empty";


                empty.innerHTML = `
                    <strong>
                        아직 등록된 리뷰가 없어요
                    </strong>

                    <span>
                        이 역을 이용해봤다면 첫 리뷰를 남겨보세요.
                    </span>
                `;


                card.appendChild(
                    empty
                );


                return card;

            }


            const stats =
                document.createElement(
                    "div"
                );


            stats.className =
                "meetup-review-stats";


            /*
                별점처럼 보이지만 실제로는
                '화장실 만족도'라는 항목임을 명확히 표시합니다.
            */

            if (
                review.toiletAverage
                !==
                null
            ) {

                const toiletStat =
                    document.createElement(
                        "div"
                    );


                toiletStat.className =
                    "meetup-review-stat";


                toiletStat.innerHTML = `
                    <span class="meetup-stat-label">
                        화장실 만족도
                    </span>

                    <strong>
                        ★ ${review.toiletAverage} / 5.0
                    </strong>

                    <small>
                        ${review.toiletRatingCount}개 평가
                    </small>
                `;


                stats.appendChild(
                    toiletStat
                );

            }


            if (
                review.transferAverage
                !==
                null
            ) {

                const transferStat =
                    document.createElement(
                        "div"
                    );


                transferStat.className =
                    "meetup-review-stat";


                const transferLabel =
                    getTransferDifficultyLabel(
                        review.transferAverage
                    );


                transferStat.innerHTML = `
                    <span class="meetup-stat-label">
                        환승 난이도
                    </span>

                    <strong>
                        ${escapeHTML(transferLabel)}
                        · ${review.transferAverage} / 3.0
                    </strong>

                    <small>
                        ${review.transferRatingCount}개 평가
                    </small>
                `;


                stats.appendChild(
                    transferStat
                );

            }


            if (
                stats.children.length
                > 0
            ) {

                card.appendChild(
                    stats
                );

            }


            const reviewMeta =
                document.createElement(
                    "div"
                );


            reviewMeta.className =
                "meetup-review-meta";


            reviewMeta.textContent =
                `실제 등록 리뷰 ${review.count}개`;


            card.appendChild(
                reviewMeta
            );


            if (
                review.latestComment
            ) {

                const quote =
                    document.createElement(
                        "blockquote"
                    );


                quote.className =
                    "meetup-review-quote";


                quote.textContent =
                    review.latestComment;


                card.appendChild(
                    quote
                );

            }


            return card;

        }


        /* ==========================================
           검색 실행
        ========================================== */

        function findMeetingPlace() {

            const myStation =
                normalizeStationName(
                    document.getElementById(
                        "myStation"
                    ).value
                );


            const friendStation =
                normalizeStationName(
                    document.getElementById(
                        "friendStation"
                    ).value
                );


            const resultArea =
                document.getElementById(
                    "resultArea"
                );


            const loadingIndicator =
                document.getElementById(
                    "loadingIndicator"
                );


            resultArea.innerHTML =
                "";


            resultArea.style.display =
                "none";


            if (
                !myStation
                ||
                !friendStation
            ) {

                alert(
                    "역 이름을 모두 입력해주세요!"
                );

                return;

            }


            if (
                !stationDB[
                    myStation
                ]
                ||
                !stationDB[
                    friendStation
                ]
            ) {

                alert(
                    "입력한 역을 찾을 수 없습니다. 자동완성 목록에서 역을 선택해주세요."
                );

                return;

            }


            if (
                myStation
                ===
                friendStation
            ) {

                resultArea.style.display =
                    "flex";


                const same =
                    document.createElement(
                        "div"
                    );


                same.className =
                    "meetup-empty-result";


                same.innerHTML = `
                    <strong>
                        두 출발역이 같아요.
                    </strong>

                    <span>
                        이미 같은 역에서 출발하므로 다른 출발역을 입력해보세요.
                    </span>
                `;


                resultArea.appendChild(
                    same
                );


                return;

            }


            loadingIndicator.style.display =
                "block";


            /*
                실제 네트워크 요청이 없으므로
                가짜 로딩 시간을 만들지 않습니다.
                다음 화면 프레임에서 바로 계산합니다.
            */

            requestAnimationFrame(
                function() {

                    const candidates =
                        getMeetingCandidates(
                            myStation,
                            friendStation
                        );


                    loadingIndicator.style.display =
                        "none";


                    resultArea.style.display =
                        "flex";


                    if (
                        candidates.length
                        ===
                        0
                    ) {

                        const empty =
                            document.createElement(
                                "div"
                            );


                        empty.className =
                            "meetup-empty-result";


                        empty.innerHTML = `
                            <strong>
                                바로 연결되는 후보 환승역이 없어요.
                            </strong>

                            <span>
                                현재 버전은 두 출발 노선이 직접 만나는 역만 찾아요.
                            </span>
                        `;


                        resultArea.appendChild(
                            empty
                        );


                        return;

                    }


                    const heading =
                        document.createElement(
                            "div"
                        );


                    heading.className =
                        "meetup-result-heading";


                    heading.innerHTML = `
                        <div>
                            <span class="meetup-result-kicker">
                                RESULT
                            </span>

                            <h3>
                                후보 역 ${candidates.length}곳
                            </h3>
                        </div>

                        <p>
                            리뷰 수가 많은 역부터 표시합니다.
                            실제 이동시간 순위는 아닙니다.
                        </p>
                    `;


                    resultArea.appendChild(
                        heading
                    );


                    candidates.forEach(
                        function(station) {

                            resultArea.appendChild(
                                createResultCard(
                                    station
                                )
                            );

                        }
                    );

                }
            );

        }


        /* ==========================================
           초기화
        ========================================== */

        document.getElementById(
            "findMeetingButton"
        ).addEventListener(
            "click",
            findMeetingPlace
        );


        document.getElementById(
            "nicknameInput"
        ).addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key
                    ===
                    "Enter"
                ) {

                    document.getElementById(
                        "passwordInput"
                    ).focus();

                }

            }
        );


        document.getElementById(
            "passwordInput"
        ).addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key
                    ===
                    "Enter"
                ) {

                    handleLogin();

                }

            }
        );


        window.addEventListener(
            "DOMContentLoaded",
            function() {

                if (
                    typeof stationDB
                    ===
                    "undefined"
                ) {

                    alert(
                        "stationData.js를 불러오지 못했습니다."
                    );

                    return;

                }


                checkLoginStatus();


                setupAutocomplete(
                    "myStation",
                    "myStationSuggestions"
                );


                setupAutocomplete(
                    "friendStation",
                    "friendStationSuggestions"
                );

            }
        );

    </script>

</body>
</html>
