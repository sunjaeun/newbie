<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가라타다 - 메인</title>
    <link rel="icon" type="image/png" href="assets/logo-mark.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <div class="header-content">
        <a href="index.html" class="brand">
            <span class="brand-logo-wrap"><img src="assets/logo-mark.png" alt="" class="brand-logo" aria-hidden="true"></span>
            <span class="brand-text">
                <span class="brand-name">가라타다</span>
                <span class="brand-page">교통 생활 커뮤니티</span>
            </span>
        </a>
        <div id="authSection" class="auth-section"></div>
    </div>
</header>

<div id="loginModal" class="modal-overlay">
    <div class="modal-content">
        <h3>로그인</h3>
        <input type="text" id="nicknameInput" placeholder="아이디를 입력하세요">
        <input type="password" id="passwordInput" placeholder="비밀번호를 입력하세요">
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="closeLoginModal()">취소</button>
            <button class="btn-primary" onclick="handleLogin()">로그인</button>
        </div>
    </div>
</div>

<nav class="nav-tabs">
    <a href="index.html" class="tab-btn active">메인</a>
    <a href="meetup.html" class="tab-btn">약속 잡기</a>
    <a href="review.html" class="tab-btn">리뷰</a>
    <a href="achievement.html" class="tab-btn">업적</a>
    <a href="wiki.html" class="tab-btn">역무위키</a>
</nav>

<main class="home-shell">
    <section class="hero-card">
        <div class="hero-copy">
            <p class="hero-eyebrow">SEOUL TRANSIT / COMMUNITY</p>
            <h1><span>가라.</span><span>타다.</span></h1>
            <p class="hero-lead">약속 장소부터 역 리뷰, 업적, 역무위키까지.<br>매일 타는 지하철을 조금 더 재미있게.</p>
            <div class="hero-actions">
                <a href="meetup.html" class="primary-btn">약속 장소 찾기 ↗</a>
                <a href="review.html" class="secondary-btn">역 리뷰 보기</a>
            </div>
        </div>

        <div class="hero-poster">
            <div class="hero-sticker">GARA<br>TADA</div>
            <img src="assets/logo-full.png" alt="가라타다 로고">
            <div class="hero-poster-caption">RIDE · REVIEW · RECORD</div>
        </div>
    </section>

    <section class="quick-grid" aria-label="주요 기능">
        <a href="review.html" class="quick-card">
            <strong>역 리뷰</strong>
            <span>화장실, 환승 난이도, 주변 상권 정보를 확인합니다.</span>
        </a>
        <a href="achievement.html" class="quick-card">
            <strong>업적</strong>
            <span>이용 기록에 따라 노선별·특별 업적을 채워보세요.</span>
        </a>
        <a href="wiki.html" class="quick-card">
            <strong>역무위키</strong>
            <span>사용자가 함께 채워가는 역별 생활 정보를 확인합니다.</span>
        </a>
    </section>
</main>

<script>
function checkLoginStatus() {
    const savedNickname = localStorage.getItem('subwayhub_user');
    const authSection = document.getElementById('authSection');
    if (savedNickname) {
        authSection.innerHTML = `<span class="user-greeting">${savedNickname}님</span><button class="auth-btn" onclick="handleLogout()">로그아웃</button>`;
    } else {
        authSection.innerHTML = `<button class="auth-btn" onclick="openLoginModal()">로그인</button>`;
    }
}
function openLoginModal() {
    document.getElementById('loginModal').style.display = 'flex';
    document.getElementById('nicknameInput').focus();
}
function closeLoginModal() {
    document.getElementById('loginModal').style.display = 'none';
    document.getElementById('nicknameInput').value = '';
    document.getElementById('passwordInput').value = '';
}
function handleLogin() {
    const nickname = document.getElementById('nicknameInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    if (!nickname) { alert('아이디를 입력해주세요!'); document.getElementById('nicknameInput').focus(); return; }
    if (!password) { alert('비밀번호를 입력해주세요!'); document.getElementById('passwordInput').focus(); return; }
    localStorage.setItem('subwayhub_user', nickname);
    closeLoginModal();
    checkLoginStatus();
}
function handleLogout() {
    localStorage.removeItem('subwayhub_user');
    checkLoginStatus();
}
document.getElementById('nicknameInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('passwordInput').focus(); });
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
window.addEventListener('load', checkLoginStatus);
</script>
</body>
</html>
